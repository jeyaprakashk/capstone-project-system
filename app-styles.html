<style>
/* =====================================================================
   Capstone Guide: single stylesheet
   Font loading: swap this @import for self-hosted @font-face if needed
   ===================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');

/* ---------- 1. Tokens ---------- */
:root{
  /* colour */
  --canvas:#F4F7FB; --paper:#FFFFFF; --tint:#E8EEF9; --soft:#EEF1F6;
  --text:#1B2433; --text-strong-2:#34405A; --muted:#5A6578;
  --primary:#2E4BA0; --primary-hover:#243D85; --accent:#BC8010;
  --border:#DFE6F2; --outline:#C9D3E6; --control-border:#8392B0;
  --success:#2F6B3F; --success-tint:#E3F0E6;
  --warning:#8A4B08; --warning-tint:#F8E7D0;
  --danger:#B3261E;  --danger-tint:#F9E1DF;
  --info:#2E4BA0;    --info-tint:#E8EEF9;
  --avatar-1:#0F7F78; --avatar-2:#7A4BC4; --avatar-3:#2E4BA0;

  /* typography */
  --font:'Source Sans 3','Segoe UI',Arial,sans-serif;
  --font-mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  --fs-kpi:26px; --fs-h1:23px; --fs-hero:20px; --fs-h2:18px;
  --fs-h3:15px;  --fs-body:14px; --fs-meta:13px; --fs-badge:12px;
  --fw-regular:400; --fw-semibold:600; --fw-bold:700;
  --lh-tight:1.2; --lh-heading:1.35; --lh-body:1.55;

  /* spacing */
  --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;

  /* shape and depth */
  --radius-card:16px; --radius-tile:14px; --radius-btn:8px; --radius-badge:6px;
  --shadow-card:0 1px 2px rgba(27,36,51,0.04);
  --shadow-selected:0 1px 3px rgba(27,36,51,0.15);
  --focus-ring:0 0 0 2px var(--paper), 0 0 0 4px var(--primary);
  --focus-ring-inset:inset 0 0 0 2px var(--primary);

  /* layout and icons */
  --sidebar-w:240px; --topbar-h:60px; --content-max:1100px;
  --icon-sm:16px; --icon-md:18px;

  /* overlays */
  --shadow-overlay:0 12px 32px rgba(27,36,51,0.18);
  --scrim:rgba(27,36,51,0.45);
  --z-sticky:10; --z-drawer:40; --z-modal:50; --z-tooltip:60;
  --modal-w:520px; --drawer-w:420px;

  /* motion */
  --dur-fast:.15s; --dur:.25s; --ease:cubic-bezier(.2,0,0,1);
}

/* ---------- 2. Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--text);
  font:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[hidden]{display:none !important}
h1,h2,h3,p{margin:0}
h1,h2,h3{color:var(--text);text-wrap:balance}
h1{font-size:var(--fs-h1);font-weight:var(--fw-semibold);line-height:1.3}
h2{font-size:var(--fs-h2);font-weight:var(--fw-semibold);line-height:var(--lh-heading)}
h3{font-size:var(--fs-h3);font-weight:var(--fw-semibold);line-height:var(--lh-heading)}
a{color:var(--primary);font-weight:var(--fw-semibold);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--primary-hover)}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
code,.mono{font-family:var(--font-mono);font-size:var(--fs-badge)}

/* ---------- 3. Text styles ---------- */
.text-hero{font-size:var(--fs-hero);font-weight:var(--fw-semibold);line-height:var(--lh-heading)}
.text-kpi{font-size:var(--fs-kpi);font-weight:var(--fw-semibold);line-height:var(--lh-tight);font-variant-numeric:tabular-nums}
.text-meta{font-size:var(--fs-meta);line-height:1.5;color:var(--muted)}
.text-label{font-size:var(--fs-meta);font-weight:var(--fw-bold);color:var(--primary)}
.text-label--warning{color:var(--warning)}
.text-badge{font-size:var(--fs-badge);font-weight:var(--fw-bold);letter-spacing:.04em;text-transform:uppercase}
.text-muted{color:var(--muted)}
.text-strong{font-weight:var(--fw-semibold)}
.num{font-variant-numeric:tabular-nums}
.student-text{white-space:pre-line;overflow-wrap:anywhere}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.title-case{text-transform:capitalize}
.measure{max-width:70ch}

/* ---------- 4. App shell and page grids ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--paper);border-right:1px solid var(--border);padding:var(--space-5) var(--space-4)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:var(--z-sticky);height:var(--topbar-h);
  background:var(--paper);border-bottom:1px solid var(--border);
  padding:0 var(--space-8);display:flex;align-items:center;justify-content:space-between}
.content{flex:1;width:100%;max-width:var(--content-max);margin-inline:auto;
  padding:var(--space-6) var(--space-8) var(--space-10);
  display:flex;flex-direction:column;gap:var(--space-6)}
.grid-kpi {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
.grid-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.grid-2   {display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:var(--space-5);align-items:start}
@media (max-width:1024px){
  .content{padding:var(--space-5) var(--space-6) var(--space-8)}
  .grid-hero,.grid-2{grid-template-columns:1fr}
  .grid-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
  .topbar{padding:0 var(--space-4)}
}
@media (max-width:520px){
  .content{padding:var(--space-4)}
  .grid-kpi{grid-template-columns:1fr}
}

/* ---------- 5. Layout primitives ---------- */
.stack{display:flex;flex-direction:column;gap:var(--space-4)}
.row{display:flex;align-items:center;gap:var(--space-3)}
.row--between{justify-content:space-between}
.row--wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.cols-2,.cols-3,.cols-4{display:grid;gap:var(--space-4)}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1024px){.cols-3,.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}

/* ---------- 6. Cards and tiles ---------- */
.card{background:var(--paper);border:1px solid var(--border);
  border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.card-header{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border)}
.card-body{padding:var(--space-5)}
.card-row{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border)}
.card-footer{padding:var(--space-3) var(--space-5);border-top:1px solid var(--border)}
.card--flat{box-shadow:none}
.card--filled{background:var(--soft);border-color:transparent;box-shadow:none}
.card--interactive{cursor:pointer;transition:border-color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.card--interactive:hover{border-color:var(--control-border);box-shadow:var(--shadow-selected)}
.card--selected{background:var(--tint);border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.tile{background:var(--paper);border:1px solid var(--border);
  border-radius:var(--radius-tile);padding:var(--space-4) var(--space-5)}
.tile--selected{background:var(--tint);border:2px solid var(--primary)}
.tile--locked{background:var(--soft)}

/* ---------- 7. Buttons ---------- */
.btn{height:34px;padding:0 var(--space-4);border:1px solid transparent;border-radius:var(--radius-btn);
  font:var(--fw-semibold) var(--fs-meta)/1 var(--font);cursor:pointer;
  transition:background-color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{background:var(--paper);color:var(--text);border-color:var(--outline)}
.btn-outline:hover{background:var(--tint)}
.btn-sm{height:30px;padding:0 var(--space-3);font-size:var(--fs-badge)}
.btn-lg{height:40px;padding:0 var(--space-5);font-size:var(--fs-body)}
.btn:disabled{background:var(--soft);color:var(--muted);border-color:var(--border);cursor:not-allowed}
.btn[aria-busy="true"]{pointer-events:none;opacity:.7}

/* ---------- 8. Form controls and fields ---------- */
input,select,textarea{height:38px;padding:0 var(--space-3);background:var(--paper);color:var(--text);
  border:1px solid var(--control-border);border-radius:var(--radius-btn);
  font:var(--fw-regular) var(--fs-body) var(--font)}
textarea{height:auto;min-height:88px;padding:var(--space-2) var(--space-3);resize:vertical}
input::placeholder{color:var(--muted)}
input:disabled,select:disabled{background:var(--soft);color:var(--muted)}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--danger)}
label{font-size:var(--fs-meta);font-weight:var(--fw-semibold)}
.field{display:flex;flex-direction:column;gap:var(--space-1)}
.field-help{font-size:var(--fs-meta);color:var(--muted)}
.field-error{font-size:var(--fs-meta);font-weight:var(--fw-semibold);color:var(--danger)}

/* ---------- 9. Navigation ---------- */
.nav-item{display:flex;align-items:center;justify-content:space-between;height:40px;
  padding:0 var(--space-3);border-radius:10px;color:var(--text-strong-2);
  font-weight:var(--fw-regular);text-decoration:none;
  transition:background-color var(--dur-fast) var(--ease)}
.nav-item:hover{background:var(--soft)}
.nav-item--active{background:var(--tint);color:var(--primary);font-weight:var(--fw-bold)}
.segmented{display:inline-flex;gap:var(--space-1);padding:var(--space-1);background:var(--tint);border-radius:12px}
.segmented button{height:38px;padding:0 var(--space-4);border:0;border-radius:9px;background:transparent;
  color:var(--text-strong-2);font:var(--fw-semibold) var(--fs-body) var(--font);cursor:pointer;
  transition:background-color var(--dur-fast) var(--ease)}
.segmented button[aria-pressed="true"]{background:var(--paper);color:var(--primary);box-shadow:var(--shadow-selected)}

/* ---------- 10. Chips, badges, counts ---------- */
.chip{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--tint);font-size:var(--fs-meta)}
.badge{display:inline-block;padding:3px 10px;border-radius:var(--radius-badge);
  font-size:var(--fs-badge);font-weight:var(--fw-bold);letter-spacing:.04em;text-transform:uppercase}
.badge--success{background:var(--success-tint);color:var(--success)}
.badge--warning{background:var(--warning-tint);color:var(--warning)}
.badge--danger{background:var(--danger-tint);color:var(--danger)}
.badge--info{background:var(--info-tint);color:var(--info)}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:11px;display:inline-flex;
  align-items:center;justify-content:center;background:var(--warning-tint);color:var(--warning);
  font-size:var(--fs-badge);font-weight:var(--fw-bold)}

/* ---------- 11. Avatars and progress ---------- */
.avatar{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;color:#fff;font-size:var(--fs-meta);font-weight:var(--fw-bold)}
.avatar-1{background:var(--avatar-1)} .avatar-2{background:var(--avatar-2)} .avatar-3{background:var(--avatar-3)}
.progress{height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--primary);border-radius:4px;
  transition:width var(--dur) var(--ease)}
.progress--indeterminate>span{width:40%;transition:none;animation:indeterminate 1.2s var(--ease) infinite}

/* ---------- 12. Tables ---------- */
.table-wrap{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-tile);overflow-x:auto}
.table-wrap:focus-visible{box-shadow:var(--focus-ring-inset)}
.table{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
.table th,.table td{padding:var(--space-2) var(--space-3);text-align:left;vertical-align:top;
  border-bottom:1px solid var(--border)}
.table thead th{background:var(--soft);color:var(--text-strong-2);
  font-size:var(--fs-meta);font-weight:var(--fw-semibold)}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover td{background:var(--canvas)}
.table--compact th,.table--compact td{padding:var(--space-1) var(--space-2)}
.table .cell-num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 13. Lists ---------- */
.list{list-style:none;margin:0;padding:0}
.list-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);
  border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:0}

/* ---------- 14. Notices (use role="status" or role="alert") ---------- */
.notice{padding:var(--space-3) var(--space-4);border-radius:var(--radius-btn);
  background:var(--info-tint);color:var(--info)}
.notice--success{background:var(--success-tint);color:var(--success)}
.notice--warning{background:var(--warning-tint);color:var(--warning)}
.notice--danger{background:var(--danger-tint);color:var(--danger)}

/* ---------- 15. Disclosure (details/summary) ---------- */
.disclosure>summary{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) 0;
  font-weight:var(--fw-semibold);cursor:pointer;list-style:none}
.disclosure>summary::-webkit-details-marker{display:none}
.disclosure>summary::before{content:"\203A";font-size:var(--fs-h3);line-height:1;
  transition:transform var(--dur-fast) var(--ease)}
.disclosure[open]>summary::before{transform:rotate(90deg)}
.disclosure>summary:focus-visible{border-radius:var(--radius-btn)}

/* ---------- 16. Misc ---------- */
.divider{border:0;border-top:1px solid var(--border);margin:var(--space-4) 0}
.empty-state{padding:var(--space-6);text-align:center;color:var(--muted)}
.icon{width:var(--icon-md);height:var(--icon-md);flex:none}
.icon--sm{width:var(--icon-sm);height:var(--icon-sm)}
.focus-inset:focus-visible{box-shadow:var(--focus-ring-inset)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 17. Keyframes and animation utilities ---------- */
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@keyframes slide-up{from{opacity:0;transform:translateY(var(--space-2))}to{opacity:1;transform:none}}
@keyframes slide-down{from{opacity:0;transform:translateY(calc(var(--space-2) * -1))}to{opacity:1;transform:none}}
@keyframes slide-in-right{from{transform:translateX(100%)}to{transform:none}}
@keyframes scale-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.5}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes indeterminate{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

.anim-fade-in{animation:fade-in var(--dur) var(--ease) both}
.anim-fade-out{animation:fade-out var(--dur) var(--ease) both}
.anim-slide-up{animation:slide-up var(--dur) var(--ease) both}
.anim-slide-down{animation:slide-down var(--dur) var(--ease) both}
.anim-slide-in-right{animation:slide-in-right var(--dur) var(--ease) both}
.anim-scale-in{animation:scale-in var(--dur) var(--ease) both}
.anim-pulse{animation:pulse 1.4s ease-in-out infinite}

.spinner{display:inline-block;width:var(--icon-md);height:var(--icon-md);border-radius:50%;
  border:2px solid var(--tint);border-top-color:var(--primary);animation:spin .7s linear infinite}
.spinner--sm{width:var(--icon-sm);height:var(--icon-sm)}

/* ---------- 18. Skeleton loading ---------- */
/* Mark the loading region aria-busy="true", hide skeletons from assistive tech with aria-hidden="true",
   and include one visible-to-screen-reader message: <span class="sr-only">Loading</span> */
.skeleton{display:block;border-radius:var(--radius-btn);
  background:linear-gradient(90deg,var(--soft) 25%,var(--tint) 50%,var(--soft) 75%);
  background-size:200% 100%;animation:shimmer 1.6s linear infinite}
.skeleton--pulse{background:var(--soft);animation:pulse 1.4s ease-in-out infinite}
.skeleton-text{height:1em;width:100%}
.skeleton-text--short{width:60%}
.skeleton-title{height:1.4em;width:40%}
.skeleton-avatar{width:36px;height:36px;border-radius:50%}
.skeleton-chip{width:72px;height:22px;border-radius:12px}
.skeleton-button{width:96px;height:34px}
.skeleton-block{width:100%;height:80px;border-radius:var(--radius-tile)}
.skeleton-group{display:flex;flex-direction:column;gap:var(--space-2)}

/* ---------- 19. Modal ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;padding:var(--space-4);animation:fade-in var(--dur-fast) var(--ease)}
.modal{background:var(--paper);border-radius:var(--radius-card);box-shadow:var(--shadow-overlay);width:100%;max-width:var(--modal-w);max-height:calc(100vh - var(--space-8));display:flex;flex-direction:column;animation:scale-in var(--dur) var(--ease)}
.modal--lg{max-width:760px}
.modal-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border)}
.modal-body{padding:var(--space-5);overflow:auto}
.modal-footer{display:flex;justify-content:flex-end;gap:var(--space-2);padding:var(--space-3) var(--space-5);border-top:1px solid var(--border)}

/* ---------- 20. Drawer ---------- */
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:var(--z-drawer);animation:fade-in var(--dur-fast) var(--ease)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:var(--drawer-w);background:var(--paper);box-shadow:var(--shadow-overlay);z-index:var(--z-drawer);display:flex;flex-direction:column;animation:slide-in-right var(--dur) var(--ease)}
.drawer--left{right:auto;left:0}
.drawer-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border)}
.drawer-body{padding:var(--space-5);overflow:auto;flex:1}
.drawer-footer{display:flex;justify-content:flex-end;gap:var(--space-2);padding:var(--space-3) var(--space-5);border-top:1px solid var(--border)}

/* ---------- 21. Tooltip (CSS only; use with aria-describedby) ---------- */
.tooltip{position:relative;display:inline-flex}
.tooltip-text{position:absolute;bottom:calc(100% + var(--space-2));left:50%;transform:translateX(-50%);background:var(--text);color:var(--paper);font-size:var(--fs-meta);line-height:var(--lh-heading);padding:var(--space-1) var(--space-2);border-radius:var(--radius-badge);white-space:nowrap;max-width:240px;z-index:var(--z-tooltip);pointer-events:none;opacity:0;visibility:hidden;transition:opacity var(--dur-fast) var(--ease)}
.tooltip:hover .tooltip-text,.tooltip:focus-within .tooltip-text{opacity:1;visibility:visible}
.tooltip--bottom .tooltip-text{bottom:auto;top:calc(100% + var(--space-2))}

/* ---------- 22. Tabs ---------- */
.tabs{display:flex;gap:var(--space-1);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:var(--space-3) var(--space-4);font:inherit;font-size:var(--fs-body);color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:var(--space-2);transition:color var(--dur-fast) var(--ease)}
.tab:hover{color:var(--text)}
.tab:focus-visible{outline:0;box-shadow:var(--focus-ring-inset)}
.tab[aria-selected="true"],.tab.is-active{color:var(--primary);font-weight:var(--fw-semibold);border-bottom-color:var(--primary)}
.tab:disabled{color:var(--muted);opacity:.5;cursor:not-allowed}
.tabpanel{padding-top:var(--space-4)}
.tabpanel[hidden]{display:none}

/* ---------- 23. Timeline and pagination ---------- */
.timeline{list-style:none;margin:0;padding:0}
.timeline-item{position:relative;padding:0 0 var(--space-5) var(--space-8)}
.timeline-item::before{content:"";position:absolute;left:11px;top:var(--space-5);bottom:0;width:2px;background:var(--border)}
.timeline-item:last-child{padding-bottom:0}
.timeline-item:last-child::before{display:none}
.timeline-dot{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--paper);border:2px solid var(--control-border);display:flex;align-items:center;justify-content:center;font-size:var(--fs-badge);font-weight:var(--fw-bold);color:var(--muted)}
.timeline-item.is-done .timeline-dot{background:var(--success);border-color:var(--success);color:var(--paper)}
.timeline-item.is-current .timeline-dot{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 3px var(--tint)}
