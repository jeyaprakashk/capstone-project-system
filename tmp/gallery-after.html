/* =========================================================
   SEMESTER PROGRESS
   ========================================================= */

.pipeline-section {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius:var(--radius-card);
  padding: 18px;
  box-shadow:var(--shadow-card);
}


/* ---------- Heading ---------- */

.pipeline-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}

.pipeline-title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  color: var(--primary-hover);
}

.semester-dates {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--fs-meta);
  color: var(--primary);
  white-space: nowrap;
}

.semester-dates strong {
  font-weight: var(--fw-semibold);
}

.date-divider {
  width: 1px;
  height: 16px;
  background: var(--border);
}


/* ---------- Pipeline ---------- */

.pipeline-track {
  display: flex;
  align-items: stretch;
  gap: 0;

  overflow-x: auto;

  padding: 1px 0 var(--space-2);

  scrollbar-width: thin;
}


/* ---------- Individual stage ---------- */

.pipeline-stage {
  flex: 1 0 126px;

  min-width: 126px;
  min-height: 132px;

  padding: 14px 13px 11px;

  border: 1px solid var(--border);
  border-radius:var(--radius-tile);

  background: var(--paper);

  box-sizing: border-box;

  text-align: left;
}


/* ---------- Stage header ---------- */

.stage-header {
  display: flex;
  align-items: flex-start;

  gap: var(--space-2);

  min-height: 42px;
}

.stage-name-wrap {
  min-width: 0;
}

.stage-label {
  font-size: var(--fs-meta);
  line-height: var(--lh-tight);

  font-weight: var(--fw-bold);

  color: var(--primary-hover);
}

.stage-subtitle {
  margin-top: 3px;

  font-size: var(--fs-meta);
  line-height: var(--lh-tight);

  color: var(--primary);
}


/* ---------- Count ---------- */

.stage-count {
  margin-top: 7px;

  min-height: 17px;

  font-size: var(--fs-meta);

  color: var(--primary);

  font-weight: var(--fw-semibold);
}


/* ---------- Progress bar ---------- */

.progress-bar {
  height: 9px;

  margin-top: 7px;

  background: var(--border);

  border-radius:var(--radius-badge);

  overflow: hidden;
}

.progress-fill {
  height: 100%;

  border-radius:var(--radius-badge);
}

.progress-fill.blue {
  background: var(--primary);
}

.progress-fill.green {
  background: var(--success);
}

.progress-fill.gray {
  background: var(--primary);
}


/* ---------- Percentage ---------- */

.stage-percent {
  min-height: 16px;

  margin-top: 7px;

  font-size: var(--fs-meta);

  color: var(--primary);

  font-weight: var(--fw-semibold);
}


/* ---------- Arrow ---------- */

.stage-arrow {
  flex: 0 0 24px;

  width: 24px;

  display: flex;

  align-items: center;
  justify-content: center;

  color: var(--primary);

  font-size: var(--fs-h1);
}


/* ---------- Development explanation ---------- */

.development-legend {
  display: flex;
  flex-wrap: wrap;

  align-items: center;

  gap: var(--space-2);

  margin-top: 7px;

  padding: 0 2px;

  font-size: var(--fs-meta);

  color: var(--primary);
}

.development-legend strong {
  color: var(--primary-hover);
}

.legend-separator {
  color: var(--muted);
}


/* ---------- Smaller screens ---------- */

@media (max-width: 900px) {

  .pipeline-heading {
    align-items: flex-start;

    flex-direction: column;

    gap: 7px;
  }

  .semester-dates {
    white-space: normal;
  }

  .pipeline-stage {
    flex-basis: 130px;
    min-width: 130px;
  }
}
